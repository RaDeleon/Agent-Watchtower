<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Agent Watchtower</title>
  <desc id="desc">The Watchtower crest beside an amber watchtower overlooking an activity chart. Know your usage. See your progress. Local agent telemetry, levels, quests and attributes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#17171d"/><stop offset="1" stop-color="#08080c"/></linearGradient>
