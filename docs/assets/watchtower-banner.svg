    <path fill="#08080c" d="M27.5 50v-4a4.5 4.5 0 0 1 9 0v4z"/>
  </g>
  <text x="102" y="72" fill="#fde68a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3">AGENT WATCHTOWER</text>
  <text x="64" y="145" fill="#f5f5f4" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="-1.5">Know your usage.</text>
  <text x="64" y="201" fill="#fbbf24" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="-1.5">See your progress.</text>
  <text x="66" y="246" fill="#a8a29e" font-family="Arial, Helvetica, sans-serif" font-size="18">Local agent telemetry. Levels, quests and attributes.</text>
